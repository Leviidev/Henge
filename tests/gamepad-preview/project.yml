name: HengeGamepadPreview
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: false
    GENERATE_INFOPLIST_FILE: true
    TARGETED_DEVICE_FAMILY: 1,2
targets:
  GamepadPreview:
    type: application
    platform: iOS
    sources:
    - App.swift
    - Fixture.swift
    - ../../ios/Henge/Components/InterfaceStyle.swift
    - ../../ios/Henge/Components/OpeningDashboard.swift
    - ../../ios/Henge/Controls/GamepadState.swift
    - ../../ios/Henge/Controls/GamepadTuning.swift
    - ../../ios/Henge/Controls/GamepadLayout.swift
    - ../../ios/Henge/Controls/PadInput.swift
    - ../../ios/Henge/Controls/GyroSteeringMath.swift
    - ../../ios/Henge/Controls/GyroSteering.swift
    - ../../ios/Henge/Controls/TouchpadTuning.swift
    - ../../ios/Henge/Controls/ControllerPostureLayout.swift
    - ../../ios/Henge/Controls/DuoControlPosture.swift
    - ../../ios/Henge/Controls/GamepadControllerSurface.swift
    - ../../ios/Henge/Controls/GamepadSurface.swift
    - ../../ios/Henge/Controls/GamepadSettingsPanel.swift
    - ../../ios/Henge/Controls/WirelessVideoControls.swift
    - ../../ios/Henge/Controls/WirelessControlsPanel.swift
    - ../../ios/Henge/Controls/WirelessInputSurface.swift
    - ../../ios/Henge/Link/LinkProtocol.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.henge.gamepadpreview
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        GENERATE_INFOPLIST_FILE: false
    info:
      path: PreviewInfo.plist
      properties:
        CFBundleDisplayName: Henge Controls Preview
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
        - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
        - UIInterfaceOrientationPortrait
        - UIInterfaceOrientationPortraitUpsideDown
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UIRequiredDeviceCapabilities:
        - arm64
  GamepadPreviewUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
    - GamepadPreviewUITests.swift
    - Fixture.swift
    - ../../ios/Henge/Controls/GamepadLayout.swift
    dependencies:
    - target: GamepadPreview
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.henge.gamepadpreview.tests
        TEST_TARGET_NAME: GamepadPreview
schemes:
  GamepadPreview:
    build:
      targets:
        GamepadPreview: all
        GamepadPreviewUITests:
        - test
    test:
      targets:
      - GamepadPreviewUITests
